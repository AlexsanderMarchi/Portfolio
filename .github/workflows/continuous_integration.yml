name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Baixa o código do repositório para o runner
      - name: Checkout
        uses: actions/checkout@v4

      # Instala o Node.js na mesma versão usada no estágio de build do Dockerfile (só roda em PR, como validação)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Instala as dependências com base no package-lock.json (só roda em PR)
      - name: Install dependencies
        run: npm ci

      # Builda a aplicação (vite build) para validar que o código compila (só roda em PR); no push pra master
      # essa validação já ocorreu durante o PR, então aqui o job só serve de gate pro workflow de build+push da imagem
      - name: Build
        run: npm run build