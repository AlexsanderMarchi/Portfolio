name: Build & push image

# Só dispara depois que o workflow "CI" terminar, garantindo que o build/testes
# já passaram antes de gerar a imagem
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      # Baixa exatamente o commit que passou no CI
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Gera o nome da imagem em minúsculas (ghcr.io exige lowercase) e expõe como output
      - name: Lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      # Autentica no GitHub Container Registry (só necessário quando for realmente publicar a imagem)
      - name: Log in to GHCR
        if: github.event.workflow_run.event == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Configura o Buildx, necessário para builds com cache e recursos avançados
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builda a imagem Docker; só publica no GHCR quando o CI rodou por causa de um push na master
      # (quando o CI rodou por PR, aqui só valida o build)
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event.workflow_run.event == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max