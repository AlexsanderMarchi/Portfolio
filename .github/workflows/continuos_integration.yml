name: Build & push image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Baixa o código do repositório para o runner
      - name: Checkout
        uses: actions/checkout@v4

      # Instala o Node.js na mesma versão usada no estágio de build do Dockerfile (só roda em PR, como validação)
      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Instala as dependências com base no package-lock.json (só roda em PR)
      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: npm ci

      # Builda a aplicação (vite build) para validar que o código compila (só roda em PR); no push pra master
      # essa validação já ocorreu durante o PR, então aqui vai direto pro build+push da imagem
      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run build

      # Gera o nome da imagem em minúsculas (ghcr.io exige lowercase) e expõe como output
      - name: Lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      # Autentica no GitHub Container Registry (só necessário quando for realmente publicar a imagem)
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Configura o Buildx, necessário para builds com cache e recursos avançados
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builda a imagem Docker; só publica no GHCR quando for push na master (em PR, só valida o build)
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
