name: Build & push image

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Baixa o código do repositório para o runner
      - name: Checkout
        uses: actions/checkout@v4

      # Instala o Node.js na mesma versão usada no estágio de build do Dockerfile
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Instala as dependências com base no package-lock.json
      - name: Install dependencies
        run: npm ci

      # Builda a aplicação (vite build) para validar que o código compila antes de gerar a imagem
      - name: Build
        run: npm run build

      # Gera o nome da imagem em minúsculas (ghcr.io exige lowercase) e expõe como output
      - name: Lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      # Autentica no GitHub Container Registry para permitir o push da imagem
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Configura o Buildx, necessário para builds com cache e recursos avançados
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builda a imagem Docker e publica no GHCR com as tags "latest" e o SHA do commit
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
