name: Deploy image to Portainer

# Só dispara depois que o workflow "Build & push image" terminar com sucesso na master,
# garantindo que a imagem já esteja publicada no GHCR antes do redeploy
on:
  workflow_run:
    workflows: ["Build & push image"]
    branches: [master]
    types: [completed]

jobs:
  deploy-push:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    steps:
      # Envia o stack.yml atualizado para a API do Portainer, forçando o pull da imagem mais recente
      - name: Redeploy stack via Portainer API
        run: |
          curl -fsSk -X PUT \
            "${{ secrets.PORTAINER_URL }}/api/stacks/${{ secrets.PORTAINER_STACK_ID }}?endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            -H "Content-Type: application/json" \
